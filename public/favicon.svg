<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Top Cleaning Team">
<!--
  Top Cleaning Team favicon. Artwork as generated, not redrawn.

  realfavicongenerator shipped this as a 1024x1024 PNG embedded in an <svg>
  wrapper: 1.4 MB. Browsers prefer image/svg+xml when it is offered, so that
  was 1.4 MB fetched on every page load to draw a 16 px icon.

  Same artwork, re-encoded at 128x128 with palette compression: ~12 KB.
  128 px is 8x the largest size a favicon is displayed at, so there is no
  visible loss in any browser context.

  Still a raster inside an SVG, so it will soften if ever rendered above
  128 px. That does not happen for favicons. If a true-vector version is
  ever wanted, one exists in git history at commit "favicon".
-->
<image width="128" height="128" href="data:image/png;base64,"/>
</svg>
