<section class='tectonic-join' id='careerApp'>
    <style>
        .tectonic-join {
            background: var(--off-white);
            padding: 100px 5%;
            position: relative;
        }

        .interlock-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 2px;
            background: rgba(13, 27, 46, 0.1);
            border: 1px solid rgba(13, 27, 46, 0.1);
        }

        .interlock-card {
            flex: 1;
            background: white;
            padding: 40px;
            transition: flex 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            position: relative;
        }

        .interlock-card.active {
            flex: 3;
            background: white;
        }

        .interlock-card:not(.active) {
            cursor: pointer;
            filter: grayscale(1);
            opacity: 0.6;
        }

        .interlock-card:not(.active):hover {
            opacity: 0.8;
        }

        .interlock-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            white-space: nowrap;
        }

        .interlock-num {
            font-family: var(--mono-font);
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-teal);
        }

        .interlock-title {
            font-family: var(--sans-font);
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--deep-navy);
            text-transform: uppercase;
        }

        .interlock-content {
            opacity: 0;
            transform: translateY(20px);
            transition: 0.4s ease;
            pointer-events: none;
        }

        .active .interlock-content {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .tect-field {
            margin-bottom: 20px;
        }

        .tect-label {
            font-family: var(--mono-font);
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 10px;
        }

        .tect-input {
            width: 100%;
            border: 1px solid #e2e8f0;
            padding: 14px;
            background: var(--off-white);
            font-family: var(--sans-font);
            transition: border-color 0.3s;
        }

        .tect-input:focus {
            border-color: var(--primary-teal);
            outline: none;
            background: white;
        }

        .tect-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .interlock-grid {
                flex-direction: column;
            }

            .interlock-card.active {
                flex: none;
            }
        }
    </style>
    <div class='interlock-grid' id='interlockWrapper'><!-- STEP 1 -->
        <article class='interlock-card active' id='t-step-1'>
            <div class='interlock-header'><span class='interlock-num'>01</span><span class='interlock-title'>Contact
                    Details</span></div>
            <div class='interlock-content'>
                <div class='tect-row'>
                    <div class='tect-field'><label class='tect-label'>FIRST NAME</label><input type='text'
                            class='tect-input'></div>
                    <div class='tect-field'><label class='tect-label'>LAST NAME</label><input type='text'
                            class='tect-input'></div>
                </div>
                <div class='tect-row'>
                    <div class='tect-field'><label class='tect-label'>EMAIL</label><input type='email'
                            class='tect-input'></div>
                    <div class='tect-field'><label class='tect-label'>PHONE</label><input type='tel' class='tect-input'>
                    </div>
                </div>
                <div class='tect-field'><label class='tect-label'>ENGLISH LEVEL</label><select class='tect-input'>
                        <option>Select...</option>
                        <option>Very High</option>
                        <option>High</option>
                        <option>Medium</option>
                    </select></div><button class='header-cta' style='width: 100%; border:none; margin-top:20px;'
                    onclick='moveTect(2)'>NEXT: ATTACHMENTS</button>
            </div>
        </article><!-- STEP 2 -->
        <article class='interlock-card' id='t-step-2'>
            <div class='interlock-header'><span class='interlock-num'>02</span><span class='interlock-title'>Resume &
                    Area</span></div>
            <div class='interlock-content'>
                <div class='tect-field'><label class='tect-label'>UPLOAD RESUME</label><input type='file'
                        class='tect-input'></div>
                <div class='tect-field'><label class='tect-label'>TARGET AREA</label><select class='tect-input'>
                        <option>Brickell</option>
                        <option>Miami Beach</option>
                        <option>Aventura</option>
                    </select></div><button class='header-cta' style='width: 100%; border:none; margin-top:20px;'
                    onclick='moveTect(3)'>NEXT: DETAILS</button>
            </div>
        </article><!-- STEP 3 -->
        <article class='interlock-card' id='t-step-3'>
            <div class='interlock-header'><span class='interlock-num'>03</span><span
                    class='interlock-title'>Information</span></div>
            <div class='interlock-content'>
                <div class='tect-row'>
                    <div class='tect-field'><label class='tect-label'>WORK AUTH US?</label><select class='tect-input'>
                            <option>Yes</option>
                            <option>No</option>
                        </select></div>
                    <div class='tect-field'><label class='tect-label'>TRANSPORT?</label><select class='tect-input'>
                            <option>Yes</option>
                            <option>No</option>
                        </select></div>
                </div>
                <div class='tect-field'><label class='tect-label'>BEST CONTACT</label><select class='tect-input'>
                        <option>WhatsApp</option>
                        <option>Phone</option>
                    </select></div>
                <div class='tect-field'><label class='tect-label'>EXPERIENCE</label><textarea class='tect-input'
                        rows='3'></textarea></div><button class='header-cta'
                    style='width: 100%; border:none; background:var(--deep-navy);'>SUBMIT APPLICATION</button>
            </div>
        </article>
    </div>
</section>
<script>function moveTect(step) { document.querySelectorAll('.interlock-card').forEach(c => c.classList.remove('active')); document.getElementById('t-step-' + step).classList.add('active'); }</script>
