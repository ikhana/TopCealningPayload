<!DOCTYPE html>
<html lang='en'>

<head>
    <style>
        :root {
            --primary-teal: #17b0ab;
            --deep-navy: #0d1b2e;
            --off-white: #f8fafc;
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--off-white);
        }

        .hero-blade {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 400px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: var(--deep-navy);
        }

        .hero-bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: saturate(1.2) contrast(1.1);
            clip-path: polygon(0 0, 45% 0, 35% 100%, 0% 100%);
        }

        .hero-bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 20%, var(--deep-navy) 40%);
            z-index: 2;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(135deg, rgba(23, 176, 171, 0.1) 0%, transparent 50%);
        }

        .hero-content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            display: flex;
            justify-content: flex-end;
        }

        .hero-text-block {
            width: 55%;
            padding: 40px;
            border-left: 8px solid var(--primary-teal);
            background: rgba(13, 27, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: skewX(-5deg);
            animation: slideIn 1s var(--transition) forwards;
        }

        .hero-text-block>* {
            transform: skewX(5deg);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px) skewX(-5deg);
                opacity: 0;
            }

            to {
                transform: translateX(0) skewX(-5deg);
                opacity: 1;
            }
        }

        .kicker {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-teal);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            color: white;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            line-height: 1.6;
            max-width: 500px;
            margin-bottom: 25px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-teal);
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .cta-btn:hover {
            background: white;
            color: var(--deep-navy);
            transform: translateY(-3px);
        }

        @media (max-width: 900px) {
            .hero-bg-image {
                clip-path: none;
                opacity: 0.4;
            }

            .hero-text-block {
                width: 100%;
                skewX: 0;
            }

            .hero-text-block>* {
                skewX: 0;
            }

            .hero-content-wrapper {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <section class='hero-blade'><img
            src='https://images.unsplash.com/photo-1581578731548-c64695cc6958?auto=format&fit=crop&q=80&w=2000'
            class='hero-bg-image'>
        <div class='hero-overlay'></div>
        <div class='hero-content-wrapper'>
            <div class='hero-text-block'><span class='kicker'>Professional & Reliable</span>
                <h1>SERVICES</h1>
                <p class='description'>Comprehensive cleaning solutions tailored to your specific needs with attention
                    to every detail.</p><a href='#all-services' class='cta-btn'>ALL SERVICES <span>&rarr;</span></a>
            </div>
        </div>
    </section>
</body>

</html>
